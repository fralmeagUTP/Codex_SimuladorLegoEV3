[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name    = "simulador-ev3"
version = "1.3.0"
description = "Simulador educativo LEGO EV3 compatible con API Pybricks"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1"]   # tkinter para escritorio, Flask para web

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "playwright>=1.45"]
web-prod = ["waitress>=3.0"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["simulador_ev3*"]
