services:
  simulador-ev3:
    build: .
    image: simulador-ev3:production
    env_file:
      - .env.production
    environment:
      EV3_WEB_HOST: 0.0.0.0
      EV3_WEB_PORT: "5050"
    expose:
      - "5050"
    read_only: true
    tmpfs:
      - /tmp/ev3:rw,noexec,nosuid,size=128m,mode=0700,uid=10001,gid=10001
    pids_limit: 64
    mem_limit: 768m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - ev3_backend

  caddy:
    image: caddy:2.8-alpine
    env_file:
      - .env.production
    ports:
      - "${EV3_WEB_HTTP_PORT:-80}:80"
      - "${EV3_WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - simulador-ev3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - default
      - ev3_backend

volumes:
  caddy_data:
  caddy_config:

networks:
  ev3_backend:
    internal: true
