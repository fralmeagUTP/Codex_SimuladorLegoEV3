<!doctype html>
<html
  lang="es"
  data-ev3-base-path="{{ request.script_root or '' }}"
  data-ev3-fit-padding-ratio="{{ fit_padding_ratio }}"
  data-ev3-sensor-beams-enabled="{{ 'true' if sensor_beams_enabled else 'false' }}"
  data-ev3-sse-enabled="{{ 'true' if sse_enabled else 'false' }}"
  data-ev3-polling-interval-ms="{{ polling_interval_ms }}"
  data-ev3-session-create-wait-ms="{{ session_create_wait_ms }}"
  data-ev3-app-version="{{ app_version }}"
>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simulador EV3 Web{% endblock %}</title>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem("ev3_theme");
        const valid = stored === "dark" || stored === "light";
        const system = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", valid ? stored : system);
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_version) }}">
  {% block head_data %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
